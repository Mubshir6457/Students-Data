<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>

    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 20px;
        }
        form {
            background: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
        button {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Student Admission Form</h2>

<form id="form">
    <input type="text" id="roll" placeholder="Roll Number" required>
    <input type="text" id="name" placeholder="Student Name" required>
    <input type="text" id="father" placeholder="Father Name" required>

    <input type="text" id="date" placeholder="Admission Date (22-03-2026)" required>

    <select id="class">
        <option>Noorani Qaida</option>
        <option>Separa</option>
    </select>

    <input type="text" id="start" placeholder="Start From" required>

    <select id="fee">
        <option>Advance</option>
        <option>After Month</option>
    </select>

    <select id="status">
        <option value="active">Active</option>
        <option value="exit">Exit</option>
    </select>

    <button type="submit">Save</button>
</form>

<br>
<button onclick="downloadExcel()">Download Excel</button>

<script>
let activeStudents = [];
let exitStudents = [];

document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();

    let student = {
        Roll: document.getElementById("roll").value,
        Name: document.getElementById("name").value,
        Father: document.getElementById("father").value,
        Date: document.getElementById("date").value,
        Class: document.getElementById("class").value,
        Start: document.getElementById("start").value,
        Fee: document.getElementById("fee").value
    };

    let status = document.getElementById("status").value;

    if(status === "active"){
        activeStudents.push(student);
    } else {
        exitStudents.push(student);
    }

    alert("Saved!");
    document.getElementById("form").reset();
});

function downloadExcel(){
    let wb = XLSX.utils.book_new();

    let ws1 = XLSX.utils.json_to_sheet(activeStudents);
    let ws2 = XLSX.utils.json_to_sheet(exitStudents);

    XLSX.utils.book_append_sheet(wb, ws1, "Active Students");
    XLSX.utils.book_append_sheet(wb, ws2, "Exit Students");

    XLSX.writeFile(wb, "Students_Data.xlsx");
}
</script>

</body>
</html>
